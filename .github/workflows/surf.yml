name: Surf check
on:
  schedule:
    - cron: "0 6 * * *"   # 8h à Paris en été (UTC+2)
    - cron: "0 7 * * *"   # 8h à Paris en hiver (UTC+1)
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Choisit le bon des deux créneaux selon l'heure d'été / d'hiver,
  # pour que le rapport soit toujours fait à 8h heure de Paris.
  horaire:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.when.outputs.go }}
    steps:
      - id: when
        run: |
          offset=$(TZ=Europe/Paris date +%z)
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 6 * * *" ] && [ "$offset" != "+0200" ]; then go=false; fi
            if [ "${{ github.event.schedule }}" = "0 7 * * *" ] && [ "$offset" != "+0100" ]; then go=false; fi
          fi
          echo "Décalage Paris : $offset, lancement : $go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  check:
    needs: horaire
    if: needs.horaire.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python windguru_surf.py --out site/index.html --marc --debug
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
